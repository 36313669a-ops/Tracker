<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>專案進度管理</title>


<style>

/* =====================================================
   基本
===================================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft JhengHei",
        sans-serif;

    background: #f7f7f7;

    color: #333;

}


/* =====================================================
   整體
===================================================== */

.app {

    display: flex;

    min-height: 100vh;

}


/* =====================================================
   左側專案
===================================================== */

.sidebar {

    width: 280px;

    background: #fff;

    border-right: 1px solid #e5e5e5;

    padding: 24px 18px;

    flex-shrink: 0;

}


.sidebar-title {

    font-size: 20px;

    font-weight: 700;

    margin-bottom: 20px;

}


/* =====================================================
   專案區塊標題
===================================================== */

.project-section {

    margin-top: 22px;

}


.project-section-title {

    display: flex;

    align-items: center;

    justify-content: space-between;

    font-size: 13px;

    font-weight: 700;

    color: #777;

    padding: 0 5px 8px;

}


.project-section-title .count {

    color: #aaa;

    font-weight: 400;

}


/* =====================================================
   專案清單
===================================================== */

.project-list {

    display: flex;

    flex-direction: column;

    gap: 6px;

}


.project-item {

    padding: 12px 13px;

    border-radius: 8px;

    cursor: pointer;

    border: 1px solid transparent;

    transition: .2s;

}


.project-item:hover {

    background: #f5f5f5;

}


.project-item.active {

    background: #eeeeee;

    border-color: #ddd;

}


.project-name {

    font-size: 14px;

    font-weight: 600;

    padding-right: 5px;

}


.project-progress {

    font-size: 12px;

    color: #888;

    margin-top: 5px;

}


.project-warning {

    font-size: 12px;

    color: #d93025;

    margin-top: 6px;

}


/* =====================================================
   已結案專案
===================================================== */

.completed-project-section {

    margin-top: 30px;

    padding-top: 18px;

    border-top: 1px solid #eee;

}


.completed-project-item {

    opacity: .75;

}


.completed-project-item .project-name {

    color: #666;

}


.completed-label {

    display: inline-block;

    font-size: 11px;

    color: #666;

    background: #eeeeee;

    border-radius: 4px;

    padding: 2px 6px;

    margin-top: 5px;

}


/* =====================================================
   主區域
===================================================== */

.main {

    flex: 1;

    padding: 30px;

    min-width: 0;

}


.top-bar {

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    gap: 20px;

    margin-bottom: 25px;

}


.project-title {

    margin: 0 0 8px;

    font-size: 30px;

}


.project-info {

    color: #777;

    font-size: 14px;

}


.project-actions {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

}


/* =====================================================
   狀態標籤
===================================================== */

.status-badge {

    display: inline-block;

    padding: 5px 9px;

    border-radius: 6px;

    font-size: 12px;

    margin-top: 8px;

}


.status-active {

    background: #eeeeee;

    color: #555;

}


.status-completed {

    background: #e7e7e7;

    color: #555;

}


/* =====================================================
   按鈕
===================================================== */

.btn {

    border: 1px solid #ddd;

    background: white;

    color: #333;

    padding: 8px 14px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 14px;

}


.btn:hover {

    background: #f3f3f3;

}


.btn-primary {

    background: #333;

    color: white;

    border-color: #333;

}


.btn-primary:hover {

    background: #222;

}


.btn-danger {

    color: #c62828;

    border-color: #e0b4b4;

}


.btn-danger:hover {

    background: #fff4f4;

}


/* =====================================================
   Dashboard
===================================================== */

.dashboard {

    display: grid;

    grid-template-columns:
        280px 1fr;

    gap: 20px;

    margin-bottom: 28px;

}


.card {

    background: white;

    border: 1px solid #e5e5e5;

    border-radius: 12px;

    padding: 22px;

}


.card-title {

    font-weight: 700;

    font-size: 17px;

    margin-bottom: 18px;

}


/* =====================================================
   圓餅圖
===================================================== */

.progress-card {

    display: flex;

    flex-direction: column;

    align-items: center;

}


.progress-chart {

    width: 170px;

    height: 170px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    margin: 10px 0 18px;

    position: relative;

}


.progress-chart::after {

    content: "";

    position: absolute;

    width: 125px;

    height: 125px;

    background: white;

    border-radius: 50%;

}


.progress-number {

    position: relative;

    z-index: 2;

    font-size: 28px;

    font-weight: 700;

}


/* =====================================================
   專案資訊
===================================================== */

.info-grid {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(180px, 1fr)
        );

    gap: 20px;

}


.info-item {

    display: flex;

    flex-direction: column;

    gap: 7px;

}


.info-item label {

    font-size: 13px;

    color: #777;

}


input,
select,
textarea {

    font-family: inherit;

}


input[type="text"],
input[type="date"],
select,
textarea {

    width: 100%;

    border: 1px solid #ddd;

    border-radius: 7px;

    padding: 9px 10px;

    background: white;

    font-size: 14px;

}


textarea {

    min-height: 100px;

    resize: vertical;

}


/* =====================================================
   待辦
===================================================== */

.todo-section {

    margin-bottom: 30px;

}


.todo-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;

}


.todo-header h2 {

    margin: 0;

    font-size: 21px;

}


.todo-list {

    display: flex;

    flex-direction: column;

    gap: 10px;

}


.todo-item {

    background: white;

    border: 1px solid #e4e4e4;

    border-radius: 10px;

    overflow: hidden;

}


/* =====================================================
   待辦主列
===================================================== */

.todo-main {

    display: grid;

    grid-template-columns:
        30px
        minmax(180px, 1fr)
        120px
        100px
        70px
        90px;

    align-items: center;

    gap: 10px;

    padding: 15px 17px;

}


.todo-checkbox {

    width: 17px;

    height: 17px;

}


.todo-name {

    font-weight: 600;

}


.todo-name.completed {

    text-decoration: line-through;

    color: #aaa;

}


.todo-date {

    font-size: 13px;

    color: #777;

}


.todo-warning {

    color: #d93025 !important;

    font-weight: 600;

}


.todo-progress {

    font-size: 13px;

    text-align: center;

}


.todo-actions {

    display: flex;

    gap: 5px;

    justify-content: flex-end;

}


.icon-btn {

    border: none;

    background: transparent;

    cursor: pointer;

    padding: 5px;

    border-radius: 5px;

}


.icon-btn:hover {

    background: #eee;

}


.todo-note {

    border-top: 1px solid #eee;

    padding: 10px 17px;

    color: #777;

    font-size: 13px;

}


/* =====================================================
   子事項
===================================================== */

.subtasks {

    border-top: 1px solid #eee;

    padding: 13px 17px 15px 57px;

    background: #fafafa;

    min-width: 0;

}


.subtask-header {

    margin-bottom: 10px;

}


.subtask-title {

    font-weight: 600;

    font-size: 14px;

}


.subtask-progress {

    color: #888;

    font-size: 12px;

    margin-top: 4px;

}


/* =====================================================
   子事項水平捲動
===================================================== */

.subtask-scroll {

    width: 100%;

    overflow-x: auto;

    overflow-y: hidden;

    padding-bottom: 8px;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: auto;

}


.subtask-scroll::-webkit-scrollbar {

    height: 9px;

}


.subtask-scroll::-webkit-scrollbar-track {

    background: #eeeeee;

    border-radius: 10px;

}


.subtask-scroll::-webkit-scrollbar-thumb {

    background: #bdbdbd;

    border-radius: 10px;

}


.subtask-scroll::-webkit-scrollbar-thumb:hover {

    background: #999;

}


.subtask-row {

    display: flex;

    flex-direction: row;

    align-items: center;

    gap: 12px;

    width: max-content;

    min-width: 100%;

}


.subtask {

    flex: 0 0 auto;

    display: flex;

    align-items: center;

    gap: 7px;

    min-width: 125px;

    padding: 8px 12px;

    background: #fff;

    border: 1px solid #e2e2e2;

    border-radius: 7px;

    white-space: nowrap;

}


.subtask input {

    width: 15px;

    height: 15px;

    flex-shrink: 0;

}


.subtask-name {

    font-size: 14px;

    white-space: nowrap;

}


.subtask-name.completed {

    color: #aaa;

    text-decoration: line-through;

}


.subtask-delete {

    flex-shrink: 0;

    border: none;

    background: transparent;

    color: #999;

    cursor: pointer;

    padding: 2px 4px;

    font-size: 14px;

}


.subtask-delete:hover {

    color: #d93025;

}


.add-subtask {

    flex: 0 0 auto;

    border: 1px dashed #bbb;

    background: white;

    color: #666;

    cursor: pointer;

    padding: 8px 13px;

    border-radius: 7px;

    white-space: nowrap;

    font-size: 13px;

}


.add-subtask:hover {

    background: #f3f3f3;

    color: #222;

}


/* =====================================================
   Priority
===================================================== */

.priority {

    font-size: 12px;

}


.priority-high {

    color: #c62828;

}


.priority-medium {

    color: #c68a00;

}


.priority-low {

    color: #388e3c;

}


/* =====================================================
   Deadline
===================================================== */

.deadline-section {

    margin-bottom: 30px;

}


.deadline-list {

    display: flex;

    flex-direction: column;

    gap: 8px;

}


.deadline-item {

    display: flex;

    justify-content: space-between;

    align-items: center;

    border: 1px solid #e5e5e5;

    border-radius: 8px;

    padding: 13px 15px;

    background: #fff;

}


.deadline-item.soon {

    border-left: 4px solid #e2a400;

}


.deadline-item.overdue {

    border-left: 4px solid #d93025;

}


.deadline-name {

    font-weight: 600;

}


.deadline-date {

    text-align: right;

    font-size: 13px;

    color: #777;

}


/* =====================================================
   Modal
===================================================== */

.modal-overlay {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.35);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 1000;

    padding: 20px;

}


.modal-overlay.show {

    display: flex;

}


.modal {

    width: 100%;

    max-width: 550px;

    max-height: 90vh;

    overflow-y: auto;

    background: white;

    border-radius: 14px;

    padding: 25px;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.18);

}


.modal h2 {

    margin-top: 0;

    margin-bottom: 20px;

}


.form-group {

    margin-bottom: 17px;

}


.form-group label {

    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    color: #666;

}


.modal-actions {

    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 22px;

}


/* =====================================================
   負責人管理
===================================================== */

.owner-row {

    display: flex;

    gap: 8px;

    align-items: center;

    margin-bottom: 9px;

}


.owner-row input {

    flex: 1;

}


.owner-row button {

    flex-shrink: 0;

}


/* =====================================================
   空白
===================================================== */

.empty {

    text-align: center;

    padding: 45px 20px;

    color: #999;

}


/* =====================================================
   平板
===================================================== */

@media (max-width: 900px) {

    .app {

        display: block;

    }


    .sidebar {

        width: 100%;

        border-right: none;

        border-bottom:
            1px solid #e5e5e5;

    }


    .project-list {

        display: grid;

        grid-template-columns:
            repeat(
                auto-fill,
                minmax(180px, 1fr)
            );

    }


    .main {

        padding: 20px;

    }


    .dashboard {

        grid-template-columns: 1fr;

    }


    .top-bar {

        flex-direction: column;

    }


    .todo-main {

        grid-template-columns:
            30px
            1fr
            70px
            70px;

    }


    .todo-date,
    .todo-progress {

        display: none;

    }


    .todo-actions {

        justify-content: flex-end;

    }

}


/* =====================================================
   手機
===================================================== */

@media (max-width: 600px) {

    .main {

        padding: 14px;

    }


    .project-title {

        font-size: 24px;

    }


    .info-grid {

        grid-template-columns: 1fr;

    }


    .todo-main {

        grid-template-columns:
            25px
            1fr
            70px;

    }


    .todo-actions {

        grid-column: 3;

        grid-row: 1;

    }


    .deadline-item {

        align-items: flex-start;

        gap: 10px;

    }


    .subtasks {

        padding-left: 20px;

    }


    .subtask {

        min-width: 120px;

    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =================================================
         左側專案
    ================================================== -->

    <aside class="sidebar">


        <div class="sidebar-title">

            現有專案一覽

        </div>


        <button
            class="btn btn-primary"
            style="
                width:100%;
                margin-bottom:5px;
            "
            onclick="openProjectModal()"
        >

            ＋ 新增專案

        </button>



        <!-- =============================================
             進行中
        ============================================== -->

        <div
            class="project-section"
        >


            <div
                class="project-section-title"
            >

                <span>

                    進行中專案

                </span>


                <span
                    id="activeProjectCount"
                    class="count"
                >

                    0

                </span>

            </div>


            <div
                id="activeProjectList"
                class="project-list"
            ></div>


        </div>



        <!-- =============================================
             已完成／結案
        ============================================== -->

        <div
            class="
                completed-project-section
                project-section
            "
        >


            <div
                class="project-section-title"
            >

                <span>

                    已完成／結案專案

                </span>


                <span
                    id="completedProjectCount"
                    class="count"
                >

                    0

                </span>

            </div>


            <div
                id="completedProjectList"
                class="project-list"
            ></div>


        </div>


    </aside>



    <!-- =================================================
         主內容
    ================================================== -->

    <main class="main">

        <div
            id="mainContent"
        ></div>

    </main>


</div>



<!-- =====================================================
     Project Modal
====================================================== -->

<div
    id="projectModal"
    class="modal-overlay"
>


    <div class="modal">


        <h2
            id="projectModalTitle"
        >

            新增專案

        </h2>


        <div class="form-group">

            <label>
                專案名稱
            </label>


            <input
                id="projectNameInput"
                type="text"
                placeholder="例如：年度活動企劃"
            >

        </div>


        <div class="form-group">

            <label>
                負責人
            </label>


            <select
                id="projectOwnerInput"
            >

                <option value="">

                    未指定

                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                專案截止日期
            </label>


            <input
                id="projectDeadlineInput"
                type="date"
            >

        </div>


        <div class="form-group">

            <label>
                專案狀態
            </label>


            <select
                id="projectStatusInput"
            >

                <option value="active">

                    進行中

                </option>


                <option value="completed">

                    專案完成已結案

                </option>

            </select>

        </div>


        <div class="modal-actions">


            <button
                class="btn"
                onclick="closeProjectModal()"
            >

                取消

            </button>


            <button
                class="btn btn-primary"
                onclick="saveProject()"
            >

                儲存

            </button>


        </div>


    </div>

</div>



<!-- =====================================================
     Todo Modal
====================================================== -->

<div
    id="todoModal"
    class="modal-overlay"
>


    <div class="modal">


        <h2
            id="todoModalTitle"
        >

            新增待辦事項

        </h2>


        <div class="form-group">

            <label>
                事項名稱
            </label>


            <input
                id="todoNameInput"
                type="text"
                placeholder="例如：完成活動主視覺"
            >

        </div>


        <div class="form-group">

            <label>
                截止日期
            </label>


            <input
                id="todoDeadlineInput"
                type="date"
            >

        </div>


        <div class="form-group">

            <label>
                重要程度
            </label>


            <select
                id="todoPriorityInput"
            >

                <option value="high">

                    🔴 高

                </option>


                <option
                    value="medium"
                    selected
                >

                    🟡 中

                </option>


                <option value="low">

                    🟢 低

                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                備註
            </label>


            <textarea
                id="todoNoteInput"
                placeholder="可以記錄進度、注意事項、聯絡窗口等"
            ></textarea>

        </div>


        <div class="modal-actions">


            <button
                class="btn"
                onclick="closeTodoModal()"
            >

                取消

            </button>


            <button
                class="btn btn-primary"
                onclick="saveTodo()"
            >

                儲存

            </button>


        </div>


    </div>

</div>



<!-- =====================================================
     負責人管理 Modal
====================================================== -->

<div
    id="ownerManagerModal"
    class="modal-overlay"
>


    <div class="modal">


        <h2>

            管理負責人

        </h2>


        <p
            style="
                color:#888;
                font-size:13px;
                margin-top:-8px;
            "
        >

            可以新增、修改或刪除負責人。

        </p>


        <div
            style="
                display:flex;
                gap:8px;
                margin:20px 0;
            "
        >


            <input
                id="newOwnerInput"
                type="text"
                placeholder="輸入新的負責人名稱"
                style="flex:1;"
            >


            <button
                class="btn btn-primary"
                onclick="addOwner()"
            >

                ＋ 新增

            </button>


        </div>


        <div
            id="ownerList"
        ></div>


        <div class="modal-actions">


            <button
                class="btn"
                onclick="closeOwnerManager()"
            >

                完成

            </button>


        </div>


    </div>

</div>



<script>

/* =====================================================
   資料初始化
===================================================== */

let data =
    JSON.parse(
        localStorage.getItem(
            "projectTrackerData"
        )
    ) || {

        owners: [],

        projects: []

    };


/* =====================================================
   舊資料相容
===================================================== */

if (!Array.isArray(data.owners)) {

    data.owners = [];

}


if (!Array.isArray(data.projects)) {

    data.projects = [];

}


/*
   舊版本沒有 status 的專案，
   自動設定成進行中。
*/

data.projects.forEach(
    project => {

        if (
            !project.status
        ) {

            project.status =
                "active";

        }


        if (
            !Array.isArray(
                project.todos
            )
        ) {

            project.todos = [];

        }


        project.todos.forEach(
            todo => {

                if (
                    !Array.isArray(
                        todo.subtasks
                    )
                ) {

                    todo.subtasks = [];

                }

            }
        );

    }
);



/* =====================================================
   舊版預設負責人移除
===================================================== */

const oldDefaultOwners = [

    "王小明",

    "李小華",

    "陳小姐"

];


data.owners =
    data.owners.filter(
        owner =>
            !oldDefaultOwners.includes(
                owner
            )
    );


data.projects.forEach(
    project => {

        if (
            oldDefaultOwners.includes(
                project.owner
            )
        ) {

            project.owner = "";

        }

    }
);



/* =====================================================
   狀態
===================================================== */

let currentProjectId =

    data.projects.length > 0

        ? data.projects[0].id

        : null;


let editingProjectId =
    null;


let editingTodoId =
    null;



/* =====================================================
   儲存
===================================================== */

function saveData() {

    localStorage.setItem(

        "projectTrackerData",

        JSON.stringify(data)

    );

}



/* =====================================================
   建立 ID
===================================================== */

function createId() {

    return (

        Date.now() +

        "_" +

        Math.random()
            .toString(36)
            .substring(2, 9)

    );

}



/* =====================================================
   HTML 安全
===================================================== */

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

function getCurrentProject() {

/* =====================================================
   日期
===================================================== */

function formatDate(
    date
) {

    if (!date) {

        return "未設定";

    }


    const parts =
        date.split("-");


    if (
        parts.length !== 3
    ) {

        return date;

    }


    return (

        parts[0] +
        "/" +
        parts[1] +
        "/" +
        parts[2]

    );

}



/* =====================================================
   專案進度
===================================================== */

function calculateProjectProgress(
    project
) {

    if (
        !project.todos ||
        project.todos.length === 0
    ) {

        return 0;

    }


    let total = 0;

    let completed = 0;


    project.todos.forEach(
        todo => {

            if (
                todo.subtasks &&
                todo.subtasks.length > 0
            ) {

                total +=
                    todo.subtasks.length;


                completed +=
                    todo.subtasks.filter(
                        sub =>
                            sub.completed
                    ).length;

            } else {

                total++;


                if (
                    todo.completed
                ) {

                    completed++;

                }

            }

        }
    );


    if (
        total === 0
    ) {

        return 0;

    }


    return Math.round(

        completed /
        total *
        100

    );

}



/* =====================================================
   Todo 進度
===================================================== */

function calculateTodoProgress(
    todo
) {

    if (
        todo.subtasks &&
        todo.subtasks.length > 0
    ) {

        const completed =
            todo.subtasks.filter(
                sub =>
                    sub.completed
            ).length;


        return Math.round(

            completed /
            todo.subtasks.length *
            100

        );

    }


    return todo.completed
        ? 100
        : 0;

}



/* =====================================================
   已完成 Todo
===================================================== */

function getCompletedTodoCount(
    project
) {

    return project.todos.filter(
        todo => {

            if (
                todo.subtasks &&
                todo.subtasks.length > 0
            ) {

                return todo.subtasks.every(
                    sub =>
                        sub.completed
                );

            }


            return todo.completed;

        }
    ).length;

}



/* =====================================================
   Deadline 狀態
===================================================== */

function getDeadlineStatus(
    dateString
) {

    if (!dateString) {

        return {

            className: "",

            textClass: "",

            icon: "",

            text: ""

        };

    }


    const today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    const deadline =
        new Date(
            dateString +
            "T00:00:00"
        );


    const diff =
        Math.ceil(

            (
                deadline -
                today
            ) /

            (
                1000 *
                60 *
                60 *
                24
            )

        );


    if (
        diff < 0
    ) {

        return {

            className:
                "overdue",

            textClass:
                "todo-warning",

            icon:
                "🔴",

            text:
                "已逾期 " +
                Math.abs(diff) +
                " 天"

        };

    }


    if (
        diff <= 3
    ) {

        return {

            className:
                "soon",

            textClass:
                "todo-warning",

            icon:
                "⚠️",

            text:

                diff === 0

                    ? "今天到期"

                    : "還有 " +
                      diff +
                      " 天"

        };

    }


    return {

        className: "",

        textClass: "",

        icon: "📅",

        text:
            "還有 " +
            diff +
            " 天"

    };

}



/* =====================================================
   專案警告
===================================================== */

function getProjectWarnings(
    project
) {

    return project.todos.filter(
        todo => {

            if (
                !todo.deadline
            ) {

                return false;

            }


            const status =
                getDeadlineStatus(
                    todo.deadline
                );


            return (

                status.className ===
                    "soon"

                ||

                status.className ===
                    "overdue"

            );

        }
    ).length;

}

/* =====================================================
   Todo 勾選
===================================================== */

function toggleTodo(
    todoId
) {

    const project =
        getCurrentProject();


    const todo =
        project.todos.find(
            item =>
                item.id ===
                todoId
        );


    if (!todo) {

        return;

    }


    if (
        todo.subtasks &&
        todo.subtasks.length > 0
    ) {

        const complete =
            !todo.subtasks.every(
                sub =>
                    sub.completed
            );


        todo.subtasks.forEach(
            sub => {

                sub.completed =
                    complete;

            }
        );

    } else {

        todo.completed =
            !todo.completed;

    }


    saveData();

    render();

}



/* =====================================================
   子事項
===================================================== */

function toggleSubtask(
    todoId,
    subtaskId
) {

    const project =
        getCurrentProject();


    const todo =
        project.todos.find(
            item =>
                item.id ===
                todoId
        );


    if (!todo) {

        return;

    }


    const sub =
        todo.subtasks.find(
            item =>
                item.id ===
                subtaskId
        );


    if (!sub) {

        return;

    }


    sub.completed =
        !sub.completed;


    saveData();

    render();

}



/* =====================================================
   新增子事項
===================================================== */

function addSubtask(
    todoId
) {

    const name =
        prompt(
            "請輸入新的子事項："
        );


    if (
        !name ||
        !name.trim()
    ) {

        return;

    }


    const project =
        getCurrentProject();


    const todo =
        project.todos.find(
            item =>
                item.id ===
                todoId
        );


    if (!todo) {

        return;

    }


    if (
        !Array.isArray(
            todo.subtasks
        )
    ) {

        todo.subtasks = [];

    }


    todo.subtasks.push({

        id:
            createId(),

        name:
            name.trim(),

        completed:
            false

    });


    saveData();

    render();

}



/* =====================================================
   刪除子事項
===================================================== */

function deleteSubtask(
    todoId,
    subtaskId
) {

    const project =
        getCurrentProject();


    const todo =
        project.todos.find(
            item =>
                item.id ===
                todoId
        );


    if (!todo) {

        return;

    }


    todo.subtasks =
        todo.subtasks.filter(
            sub =>
                sub.id !==
                subtaskId
        );


    saveData();

    render();

}



/* =====================================================
   Todo Modal
===================================================== */

function openTodoModal(
    todoId = null
) {

    editingTodoId =

    const modal =
        document.getElementById(
            "todoModal"
        );

            "todoModalTitle"
        );

        ).value = "";


        document.getElementById(
            "todoDeadlineInput"
        ).value = "";


        document.getElementById(
            "todoPriorityInput"

/* =====================================================
   關閉 Todo
===================================================== */

function closeTodoModal() {

        .getElementById(
            "todoModal"
        )
        .classList.remove(
            "show"
        );

}



/* =====================================================
   儲存 Todo
===================================================== */

function saveTodo() {

    const name =
        document.getElementById(
            "todoNameInput"
        ).value.trim();


    if (!name) {

        alert(
            "請輸入事項名稱"
        );

        return;

    }


    const project =
        getCurrentProject();


    if (!project) {

        return;

    }


    if (editingTodoId) {

        const todo =
            project.todos.find(
                item =>
                    item.id ===
                    editingTodoId
            );


        if (!todo) {

            return;

        }


        todo.name =
            name;


        todo.deadline =
            document.getElementById(
                "todoDeadlineInput"
            ).value;


        todo.priority =
            document.getElementById(
                "todoPriorityInput"
            ).value;


        todo.note =
            document.getElementById(
                "todoNoteInput"
            ).value;

    } else {

        project.todos.push({

            id:
                createId(),

            name:
                name,

            deadline:
                document.getElementById(
                    "todoDeadlineInput"
                ).value,

            priority:
                document.getElementById(
                    "todoPriorityInput"
                ).value,

            note:
                document.getElementById(
                    "todoNoteInput"
                ).value,

            completed:
                false,

            subtasks:
                []

        });

    }


    saveData();

    closeTodoModal();

    render();

}



/* =====================================================
   刪除 Todo
===================================================== */

function deleteTodo(
    todoId
) {

    if (
        !confirm(
            "確定要刪除這個待辦事項嗎？"
        )
    ) {

        return;

    }


    const project =
        getCurrentProject();


    project.todos =
        project.todos.filter(
            todo =>
                todo.id !==
                todoId
        );


    saveData();

    render();

}

   Project Modal

        .getElementById(
            "projectModal"
        )
        .classList.remove(
            "show"
        );

}



/* =====================================================
   負責人選單
===================================================== */

function updateOwnerSelect() {

    const select =
        document.getElementById(
            "projectOwnerInput"
        );


    select.innerHTML = `

        <option value="">

            未指定

        </option>


        ${
            data.owners
                .map(
                    owner => `

                        <option
                            value="${escapeHtml(
                                owner
                            )}"
                        >

                            ${escapeHtml(
                                owner
                            )}

                        </option>

                    `
                )
                .join("")
        }

    `;

}



/* =====================================================
   儲存 Project
===================================================== */

function saveProject() {

    const name =
        document.getElementById(
            "projectNameInput"
        ).value.trim();


    if (!name) {

        alert(
            "請輸入專案名稱"
        );

        return;

    }


    const deadline =
        document.getElementById(
            "projectDeadlineInput"
        ).value;


    const owner =
        document.getElementById(
            "projectOwnerInput"
        ).value;


    const status =
        document.getElementById(
            "projectStatusInput"
        ).value;


    if (editingProjectId) {

        const project =
            data.projects.find(
                item =>
                    item.id ===
                    editingProjectId
            );


        project.name =
            name;


        project.deadline =
            deadline;


        project.owner =
            owner;


        project.status =
            status;


    } else {

        const project = {

            id:
                createId(),

            name:
                name,

            deadline:
                deadline,

            owner:
                owner,

            status:
                status,

            todos:
                []

        };


        data.projects.push(
            project
        );


        currentProjectId =
            project.id;

    }


    saveData();

    closeProjectModal();

    render();

}

   ★ 修改專案狀態
===================================================== */

function changeProjectStatus(
    status
) {

    const project =
        getCurrentProject();

    }

    saveData();


    /*
       不需要重新建立專案。
       只要 render，

}

   修改負責人

===================================================== */

) {

/* =====================================================
   刪除 Project
===================================================== */

function deleteProject() {

    const project =
        getCurrentProject();


    if (!project) {

        return;

    }


    if (
        !confirm(
            "確定要刪除「" +
            project.name +
            "」嗎？"
        )

/* =====================================================
   負責人管理
===================================================== */

function openOwnerManager() {

    renderOwnerManager();


    document
        .getElementById(
            "ownerManagerModal"
        )
        .classList.add(
            "show"
        );

}



function renderOwnerManager() {

    const container =
        document.getElementById(
            "ownerList"
        );


    if (
        data.owners.length === 0
    ) {

        container.innerHTML = `

            <div
                class="empty"
                style="
                    border:
                        1px dashed #ddd;

                    border-radius:8px;

                    padding:25px;
                "
            >

                目前沒有負責人。

                <br>

                請在上方新增。

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    data.owners.forEach(
        (owner, index) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "owner-row";


            row.innerHTML = `

                <input
                    id="
                        ownerInput-${index}
                    "
                    type="text"
                    value="${escapeHtml(
                        owner
                    )}"
                >


                <button
                    class="btn"
                    onclick="
                        editOwner(
                            ${index}
                        )
                    "
                >

                    修改

                </button>


                <button
                    class="
                        btn
                        btn-danger
                    "
                    onclick="
                        deleteOwner(
                            ${index}
                        )
                    "
                >

                    刪除

                </button>

            `;


            container.appendChild(
                row
            );

        }
    );

}



/* =====================================================
   新增負責人
===================================================== */

function addOwner() {

    const input =
        document.getElementById(
            "newOwnerInput"
        );


    const name =
        input.value.trim();


    if (!name) {

        alert(
            "請輸入負責人名稱"
        );

        return;

    }


    if (
        data.owners.includes(
            name
        )
    ) {

        alert(
            "這個負責人已經存在。"
        );

        return;

    }


    data.owners.push(
        name
    );


    input.value = "";


    saveData();

    renderOwnerManager();

    render();

}



/* =====================================================
   修改負責人
===================================================== */

function editOwner(
    index
) {

    const input =
        document.getElementById(
            "ownerInput-" +
            index
        );


    if (!input) {

        return;

    }


    const oldName =
        data.owners[index];


    const newName =
        input.value.trim();


    if (!newName) {

        alert(
            "負責人名稱不能為空。"
        );

        return;

    }


    if (
        newName === oldName
    ) {

        return;

    }


    if (
        data.owners.includes(
            newName
        )
    ) {

        alert(
            "這個負責人名稱已經存在。"
        );

        return;

    }


    data.owners[index] =
        newName;


    /*
       所有使用舊名稱的專案
       同步更新
    */

    data.projects.forEach(
        project => {

            if (
                project.owner ===
                oldName
            ) {

                project.owner =
                    newName;

            }

        }
    );


    saveData();

    renderOwnerManager();

    render();

}



/* =====================================================
   刪除負責人
===================================================== */

function deleteOwner(
    index
) {

    const owner =
        data.owners[index];


    if (!owner) {

        return;

    }


    const usingProjects =
        data.projects.filter(
            project =>
                project.owner ===
                owner
        );


    let message =
        "確定要刪除「" +
        owner +
        "」嗎？";


    if (
        usingProjects.length > 0
    ) {

        message +=

            "\n\n目前有 " +

            usingProjects.length +

            " 個專案正在使用這位負責人。" +

            "\n刪除後這些專案會變成「未指定」。";

    }


    if (
        !confirm(message)
    ) {

        return;

    }


    data.owners.splice(
        index,
        1
    );


    data.projects.forEach(
        project => {

            if (
                project.owner ===
                owner
            ) {

                project.owner = "";

            }

        }
    );


    saveData();

    renderOwnerManager();

    render();

}



/* =====================================================
   關閉負責人管理
===================================================== */

function closeOwnerManager() {

    document
        .getElementById(
            "ownerManagerModal"
        )
        .classList.remove(
            "show"
        );

}



/* =====================================================
   Deadline
===================================================== */

function renderDeadlines() {

    const container =
        document.getElementById(
            "deadlineList"
        );


    const project =
        getCurrentProject();


    if (
        !container ||
        !project
    ) {

        return;

    }


    const todos =
        project.todos

            .filter(
                todo =>
                    todo.deadline
            )

            .sort(
                (a, b) =>
                    a.deadline.localeCompare(
                        b.deadline
                    )
            );


    if (
        todos.length === 0
    ) {

        container.innerHTML = `

            <div
                class="empty"
            >

                尚未設定任何截止日期

            </div>

        `;

        return;

    }


    container.innerHTML =

        todos

            .map(
                todo => {

                    const status =
                        getDeadlineStatus(
                            todo.deadline
                        );


                    return `

                        <div
                            class="
                                deadline-item
                                ${status.className}
                            "
                        >

                            <div>

                                <div
                                    class="
                                        deadline-name
                                    "
                                >

                                    ${status.icon}

                                    ${escapeHtml(
                                        todo.name
                                    )}

                                </div>


                                <div
                                    style="
                                        font-size:12px;
                                        color:#888;
                                        margin-top:5px;
                                    "
                                >

                                    目前進度：

                                    ${calculateTodoProgress(
                                        todo
                                    )}%

                                </div>

                            </div>


                            <div
                                class="
                                    deadline-date
                                "
                            >

                                ${formatDate(
                                    todo.deadline
                                )}

                                <br>


                                <span
                                    class="
                                        ${status.textClass}
                                    "
                                >

                                    ${status.text}

                                </span>

                            </div>

                        </div>

                    `;

                }
            )

            .join("");

}



/* =====================================================
   Modal 外部關閉
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        if (
            event.target.classList &&
            event.target.classList.contains(
                "modal-overlay"
            )
        ) {

            event.target.classList.remove(
                "show"
            );

        }

    }
);



/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeProjectModal();

            closeTodoModal();

            closeOwnerManager();

        }

    }
);



/* =====================================================
   啟動
===================================================== */

saveData();

render();

</script>
